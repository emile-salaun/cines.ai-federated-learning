<svg class="wsf" viewBox="0 0 712 320" width="712" height="320" role="img" aria-label="One group is one federation: the group lead starts the SuperLink and launches the runs; each seat runs a SuperNode on its own data and connects out to the SuperLink." xmlns="http://www.w3.org/2000/svg">
<title>One group is one federation: the group lead starts the SuperLink and launches the runs; each seat runs a SuperNode on its own data and connects out to the SuperLink.</title>
<style>.wsf .t-ink{fill:var(--wsf-ink,#1c2b28)}.wsf .t-muted{fill:var(--wsf-muted,#5d6b67)}.wsf .t-on{fill:var(--wsf-on,#ffffff)}.wsf .t-on-soft{fill:var(--wsf-on,#ffffff)}.wsf .t-accent{fill:var(--wsf-accent,#2f8a72)}.wsf .f-panel{fill:var(--wsf-panel,#f5f8f7)}.wsf .f-node{fill:var(--wsf-node,#ffffff)}.wsf .f-line{fill:var(--wsf-line,#dde6e2)}.wsf .f-strong{fill:var(--wsf-strong,#1f3d37)}.wsf .f-on{fill:var(--wsf-on,#ffffff)}.wsf .f-ink{fill:var(--wsf-ink,#1c2b28)}.wsf .f-accent{fill:var(--wsf-accent,#2f8a72)}.wsf .f-accent-soft{fill:var(--wsf-accent-soft,#d8eee7)}.wsf .f-warn{fill:var(--wsf-warn,#c0661a)}.wsf .f-warn-soft{fill:var(--wsf-warn-soft,#fbeadb)}.wsf .s-line{stroke:var(--wsf-line,#dde6e2)}.wsf .s-node{stroke:var(--wsf-node-line,#c3d3ce)}.wsf .s-ink{stroke:var(--wsf-ink,#1c2b28)}.wsf .s-on{stroke:var(--wsf-on,#ffffff)}.wsf .s-accent{stroke:var(--wsf-accent,#2f8a72)}.wsf .s-warn{stroke:var(--wsf-warn,#c0661a)}.wsf .t-on-soft{opacity:.8}.wsf circle.f-accent:hover{fill:var(--wsf-strong,#1f3d37)}.wsf text{font-family:var(--md-text-font-family,Inter,system-ui,sans-serif)}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5 z" class="f-accent" fill="#2f8a72"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5 z" class="f-ink" fill="#1c2b28"/></marker></defs>
<rect x="1" y="1" width="710" height="318" rx="16" class="f-panel s-line" fill="#f5f8f7" stroke="#dde6e2" stroke-width="1.5"/><text x="20" y="34" class="t-ink" fill="#1c2b28" font-size="16" font-weight="700" text-anchor="start">One group = one federation</text><text x="20" y="54" class="t-muted" fill="#5d6b67" font-size="13" text-anchor="start">Every group of the hands-on runs one federation like this</text><rect x="256" y="84" width="200" height="56" rx="28" class="f-strong" fill="#1f3d37"/><text x="356" y="108" class="t-on" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">SuperLink</text><text x="356" y="126" class="t-on-soft" fill="#ffffff" font-size="12" text-anchor="middle">runs the rounds, averages</text><rect x="30" y="84" width="170" height="56" rx="12" class="f-node s-node" fill="#ffffff" stroke="#c3d3ce" stroke-width="1.5"/><g transform="translate(44 100)" class="s-ink" stroke="#1c2b28" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="6" r="4.5"/><path d="M1 21 c0-5 3.6-8 8-8 s8 3 8 8"/></g><text x="72" y="107" class="t-ink" fill="#1c2b28" font-size="13" font-weight="700" text-anchor="start">Group lead</text><text x="72" y="125" class="t-muted" fill="#5d6b67" font-size="11.5" text-anchor="start">starts it, launches runs</text><path d="M200 112 L250 112" class="s-ink" stroke="#1c2b28" stroke-width="1.8" fill="none" marker-end="url(#ak)"/><line x1="490" y1="100" x2="490" y2="76" class="s-accent" stroke="#2f8a72" stroke-width="2" marker-end="url(#ah)"/><text x="504" y="92" class="t-muted" fill="#5d6b67" font-size="12" text-anchor="start">Each SuperNode connects</text><text x="504" y="108" class="t-muted" fill="#5d6b67" font-size="12" text-anchor="start">out to the SuperLink.</text><text x="504" y="128" class="t-muted" fill="#5d6b67" font-size="12" text-anchor="start">Global weights down,</text><text x="504" y="144" class="t-muted" fill="#5d6b67" font-size="12" text-anchor="start">updated weights up,</text><text x="504" y="160" class="t-muted" fill="#5d6b67" font-size="12" text-anchor="start">on that same connection.</text><rect x="20" y="222" width="150" height="64" rx="12" class="f-node s-node" fill="#ffffff" stroke="#c3d3ce" stroke-width="1.5"/><g transform="translate(34 234)" class="s-ink" stroke="#1c2b28" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="6" r="4.5"/><path d="M1 21 c0-5 3.6-8 8-8 s8 3 8 8"/></g><text x="64" y="249" class="t-ink" fill="#1c2b28" font-size="13" font-weight="700" text-anchor="start">Seat 1</text><text x="64" y="268" class="t-muted" fill="#5d6b67" font-size="12" text-anchor="start">SuperNode</text><g transform="translate(138 242) scale(0.95)" class="s-accent" stroke="#2f8a72" fill="none" stroke-width="1.8"><ellipse cx="9" cy="4" rx="8" ry="3.2"/><path d="M1 4 v14 c0 1.8 3.6 3.2 8 3.2 s8-1.4 8-3.2 v-14"/><path d="M1 11 c0 1.8 3.6 3.2 8 3.2 s8-1.4 8-3.2"/></g><path d="M95 218 L311 146" class="s-accent" stroke="#2f8a72" stroke-width="1.8" fill="none" marker-end="url(#ah)"/><rect x="194" y="222" width="150" height="64" rx="12" class="f-node s-node" fill="#ffffff" stroke="#c3d3ce" stroke-width="1.5"/><g transform="translate(208 234)" class="s-ink" stroke="#1c2b28" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="6" r="4.5"/><path d="M1 21 c0-5 3.6-8 8-8 s8 3 8 8"/></g><text x="238" y="249" class="t-ink" fill="#1c2b28" font-size="13" font-weight="700" text-anchor="start">Seat 2</text><text x="238" y="268" class="t-muted" fill="#5d6b67" font-size="12" text-anchor="start">SuperNode</text><g transform="translate(312 242) scale(0.95)" class="s-accent" stroke="#2f8a72" fill="none" stroke-width="1.8"><ellipse cx="9" cy="4" rx="8" ry="3.2"/><path d="M1 4 v14 c0 1.8 3.6 3.2 8 3.2 s8-1.4 8-3.2 v-14"/><path d="M1 11 c0 1.8 3.6 3.2 8 3.2 s8-1.4 8-3.2"/></g><path d="M269 218 L341 146" class="s-accent" stroke="#2f8a72" stroke-width="1.8" fill="none" marker-end="url(#ah)"/><rect x="368" y="222" width="150" height="64" rx="12" class="f-node s-node" fill="#ffffff" stroke="#c3d3ce" stroke-width="1.5"/><g transform="translate(382 234)" class="s-ink" stroke="#1c2b28" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="6" r="4.5"/><path d="M1 21 c0-5 3.6-8 8-8 s8 3 8 8"/></g><text x="412" y="249" class="t-ink" fill="#1c2b28" font-size="13" font-weight="700" text-anchor="start">Seat 3</text><text x="412" y="268" class="t-muted" fill="#5d6b67" font-size="12" text-anchor="start">SuperNode</text><g transform="translate(486 242) scale(0.95)" class="s-accent" stroke="#2f8a72" fill="none" stroke-width="1.8"><ellipse cx="9" cy="4" rx="8" ry="3.2"/><path d="M1 4 v14 c0 1.8 3.6 3.2 8 3.2 s8-1.4 8-3.2 v-14"/><path d="M1 11 c0 1.8 3.6 3.2 8 3.2 s8-1.4 8-3.2"/></g><path d="M443 218 L371 146" class="s-accent" stroke="#2f8a72" stroke-width="1.8" fill="none" marker-end="url(#ah)"/><rect x="542" y="222" width="150" height="64" rx="12" class="f-node s-node" fill="#ffffff" stroke="#c3d3ce" stroke-width="1.5"/><g transform="translate(556 234)" class="s-ink" stroke="#1c2b28" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="6" r="4.5"/><path d="M1 21 c0-5 3.6-8 8-8 s8 3 8 8"/></g><text x="586" y="249" class="t-ink" fill="#1c2b28" font-size="13" font-weight="700" text-anchor="start">Seat 4</text><text x="586" y="268" class="t-muted" fill="#5d6b67" font-size="12" text-anchor="start">SuperNode</text><g transform="translate(660 242) scale(0.95)" class="s-accent" stroke="#2f8a72" fill="none" stroke-width="1.8"><ellipse cx="9" cy="4" rx="8" ry="3.2"/><path d="M1 4 v14 c0 1.8 3.6 3.2 8 3.2 s8-1.4 8-3.2 v-14"/><path d="M1 11 c0 1.8 3.6 3.2 8 3.2 s8-1.4 8-3.2"/></g><path d="M617 218 L401 146" class="s-accent" stroke="#2f8a72" stroke-width="1.8" fill="none" marker-end="url(#ah)"/><text x="20" y="306" class="t-muted" fill="#5d6b67" font-size="12" text-anchor="start">One seat per member: a SuperNode that trains on its own data partition.</text>
</svg>
