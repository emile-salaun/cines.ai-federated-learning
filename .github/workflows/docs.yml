# =============================================================================
# docs.yml - Build the workshop site with Zensical and publish it on GitHub Pages.
#
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
# Pull requests: build only (catches broken links/snippets with --strict).
# Push to main: build + deploy
# =============================================================================
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "includes/**"
      - "overrides/**"
      - "zensical.toml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      - "slides/**"
  pull_request:
    paths:
      - "docs/**"
      - "includes/**"
      - "overrides/**"
      - "zensical.toml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      - "slides/**"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel a deployment in progress.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install Zensical
        run: pip install -r requirements-docs.txt

      - name: Build site (scenario from zensical.toml, B by default)
        run: zensical build --clean --strict

      # Second copy with the other hands-on scenario, published at /scenario-a/
      # and linked from nowhere: trainers switch by sharing that URL, with no
      # rebuild. Building it here also checks the A-only blocks with --strict.
      - name: Build site (scenario A, at /scenario-a/)
        run: |
          sed -e 's/^scenario = "[AB]"/scenario = "A"/' \
              -e 's|^site_url = "\(.*\)/"|site_url = "\1/scenario-a/"|' \
              -e '/^\[project\]$/a site_dir = "site-scenario-a"' \
              zensical.toml > zensical.scenario-a.toml
          grep -q '^scenario = "A"' zensical.scenario-a.toml    # fail if the switch was renamed
          zensical build --clean --strict -f zensical.scenario-a.toml
          mv site-scenario-a site/scenario-a

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build slides (HTML + PDF)
        run: |
          MARP="npx --yes @marp-team/marp-cli@4.5.1"
          mkdir -p site/slides
          cp -r slides/images slides/widgets.js site/slides/
          $MARP --html --theme-set slides/themes -o site/slides/index.html -- slides/talk.md
          $MARP --html --allow-local-files --theme-set slides/themes --pdf -o site/slides/talk.pdf -- slides/talk.md
          cp -r site/slides site/scenario-a/slides     # Concepts links to ../slides/

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4